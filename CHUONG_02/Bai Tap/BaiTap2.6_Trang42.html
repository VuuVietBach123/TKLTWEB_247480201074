<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bảng tiền thưởng và Công thức</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        table {
            border-collapse: collapse;
            width: 300px;
            margin-top: 10px;
            margin-bottom: 20px;
        }
        table, th, td {
            border: 1px solid black;
        }
        th, td {
            padding: 6px 12px;
            text-align: left;
        }
        .formula {
            font-size: 16px;
            line-height: 1.8;
        }
    </style>
</head>
<body>

    <h3>BẢNG TIỀN THƯỞNG</h3>

    <table>
        <thead>
            <tr>
                <th>Loại</th>
                <th>Tiền thưởng</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Giỏi</td>
                <td>300000</td>
            </tr>
            <tr>
                <td>Khá</td>
                <td>100000</td>
            </tr>
            <tr>
                <td>TB</td>
                <td>50000</td>
            </tr>
            <tr>
                <td>Yếu</td>
                <td>0</td>
            </tr>
        </tbody>
    </table>

    <h3>CÔNG THỨC</h3>

    <div class="formula">
        H<sub>2</sub>O &nbsp;&nbsp; 
        O<sup>o</sup>C &nbsp;&nbsp; 
        H<sub>2</sub>SO<sub>4</sub> &nbsp;&nbsp;&nbsp;&nbsp; 
        A<sup>2</sup> + B<sup>2</sup> <br>
        (A+B)<sup>3</sup> &nbsp;&nbsp;&nbsp;&nbsp; 
        NH<sub>3</sub> . . .
    </div>

</body>
</html>
