<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký dự thi</title>
    <style>
        .container {
            width: 650px;
            border: 1px solid #000;
            font-family: Arial, sans-serif;
            margin: 20px auto;
        }
        .header-title {
            background-color: #d3d3d3;
            padding: 5px 10px;
            font-weight: bold;
            border-bottom: 1px solid #000;
        }
        .header-content {
            display: flex;
            justify-content: space-between;
            padding: 10px 20px;
            font-size: 13px;
            font-weight: bold;
        }
        .main-title {
            text-align: center;
            font-family: Verdana, sans-serif;
            font-size: 20px;
            color: red;
            font-weight: bold;
            margin: 15px 0;
        }
        .form-content {
            padding: 10px 50px;
        }
        .form-group {
            margin-bottom: 15px;
            display: flex;
            align-items: flex-start;
        }
        .form-group label {
            width: 120px;
        }
        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .radio-inline {
            display: flex;
            gap: 20px;
        }
        .button-group {
            text-align: center;
            margin: 20px 0;
        }
        .button-group input {
            padding: 5px 20px;
            margin: 0 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-title">Đăng ký dự thi</div>
    
    <div class="header-content">
        <div>
            TRƯỜNG ĐẠI HỌC BẠC LIÊU<br>
            KHOA KỸ THUẬT VÀ CÔNG NGHỆ
        </div>
        <div style="text-align: center;">
            CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM<br>
            Độc lập - Tự do - Hạnh phúc
        </div>
    </div>

    <div class="main-title">ĐĂNG KÝ XÉT TUYỂN</div>

    <form class="form-content">
        <div class="form-group">
            <label for="fullname">Họ tên :</label>
            <input type="text" id="fullname" name="fullname" style="width: 250px;">
        </div>

        <div class="form-group">
            <label>Giới tính:</label>
            <div class="radio-inline">
                <label><input type="radio" name="gender" value="Nam" checked> Nam</label>
                <label><input type="radio" name="gender" value="Nữ"> Nữ</label>
            </div>
        </div>

        <div class="form-group">
            <label>Ngành thi:</label>
            <div class="radio-group">
                <label><input type="radio" name="major" value="CNTT" checked> Công nghệ thông tin</label>
                <label><input type="radio" name="major" value="MN"> Mầm non</label>
                <label><input type="radio" name="major" value="AN"> Âm nhạc</label>
            </div>
        </div>

        <div class="button-group">
            <input type="submit" value="Đồng ý">
            <input type="button" value="Không đồng ý">
        </div>
    </form>
</div>

</body>
</html>
