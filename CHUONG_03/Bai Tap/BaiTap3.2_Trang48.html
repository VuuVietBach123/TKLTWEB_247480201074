<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<head>
    <style>
        container 
        {
            border: 2px solid #000;
            padding: 20px;
            width: 450px;
            margin: 20px auto;
            text-align: center;
            font-family: "Times New Roman", Times, serif;
        }
        h2
        {
            color: red;
        }
        doan1
        {
            font-size: 14px;
            font-style: italic;
            color: white;
            background-color: blue;
            padding: 15px;
            text-align: left;
            margin-bottom: 0;
        }
        doan2
        {
            font-size: 14px;
            font-style: italic;
            color: yellow;
            background-color: brown;
            padding: 15px;
            text-align: left;
            margin-top: 0;
        }
        .doan1 p, .doan2 p
        {
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2> QUÊ HƯƠNG </h2>
        <div class="doan1">
            <p> Quê hương là chùm khế ngọt </p>
            <p> Cho con trèo hái mỗi ngày </p>
            <p> Quê hương là con diều biết </p>
            <p> Tuổi thơ con thả trên đồng </p>
        </div>
        <div class="doan2">
            <p> Quê hương là cầu tre nhỏ </p>
            <p> Mẹ về nón lá nghiêng che </p>
            <p> Quê hương mỗi người chỉ một </p>
            <p> Như là chỉ một mẹ thôi </p>
        </div>
    </div>
