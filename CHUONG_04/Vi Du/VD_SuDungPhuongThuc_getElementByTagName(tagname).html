<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sử dụng phương thức_getElementByTagName(tagname)</title>
</head>
<body>
    <ul>
        <li> Microsoft Word </li>
        <li> Microsoft Excel </li>
    </ul>
    <script language = "javascript">
        var a = document.getElementsByTagName("li");
        a[0].innerHTML = "Soạn thảo văn bản";
        a[1].innerHTML = "Xử lý bảng tính";
    </script>
</body>
</html>
