<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài tập JavaScript 21A</title>
</head>
<body>
    <h3>Bài tập JavaScript 21A</h3>
    <label>Số 1: </label>
    <input type="number" id="So01"><br><br>
    
    <label>Số 2: </label>
    <input type="number" id="so02"><br><br>
    
    <label>Kết quả: </label>
    <input type="text" id="Ketqua" readonly><br><br>

    <button onclick="tinh('+')">Cộng</button>
    <button onclick="tinh('-')">Trừ</button>
    <button onclick="tinh('*')">Nhân</button>
    <button onclick="tinh('/')">Chia</button>

    <script>
        function tinh(phepTinh) {
            let num1 = parseFloat(document.getElementById("So01").value);
            let num2 = parseFloat(document.getElementById("so02").value);
            let kq = document.getElementById("Ketqua");

            if (isNaN(num1) || isNaN(num2)) {
                kq.value = "Vui lòng nhập đủ 2 số!";
                return;
            }

            switch (phepTinh) {
                case '+':
                    kq.value = num1 + num2;
                    break;
                case '-':
                    kq.value = num1 - num2;
                    break;
                case '*':
                    kq.value = num1 * num2;
                    break;
                case '/':
                    kq.value = num2 !== 0 ? num1 / num2 : "Không chia được cho 0";
                    break;
            }
        }
    </script>
</body>
</html>
