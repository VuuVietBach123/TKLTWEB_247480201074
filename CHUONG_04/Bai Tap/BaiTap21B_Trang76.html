<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài tập JavaScript 21B_Trang76</title>
</head>
<body>
    <h3>Bài tập JavaScript 21B</h3>
    <label>Số 1: </label>
    <input type="number" id="So01"><br><br>
    
    <label>Số 2: </label>
    <input type="number" id="so02"><br><br>
    
    <label>Kết quả: </label>
    <input type="text" id="Ketqua" readonly><br><br>

    <input type="radio" name="phepTinh" value="+" checked> Cộng
    <input type="radio" name="phepTinh" value="-"> Trừ
    <input type="radio" name="phepTinh" value="*"> Nhân
    <input type="radio" name="phepTinh" value="/"> Chia
    <br><br>

    <button onclick="thucHienTinh()">Tính</button>

    <script>
        function thucHienTinh() {
            let num1 = parseFloat(document.getElementById("So01").value);
            let num2 = parseFloat(document.getElementById("so02").value);
            let kq = document.getElementById("Ketqua");

            if (isNaN(num1) || isNaN(num2)) {
                kq.value = "Vui lòng nhập đủ 2 số!";
                return;
            }

            let phepTinh = document.querySelector('input[name="phepTinh"]:checked').value;

            switch (phepTinh) {
                case '+':
                    kq.value = num1 + num2;
                    break;
                case '-':
                    kq.value = num1 - num2;
                    break;
                case '*':
                    kq.value = num1 * num2;
                    break;
                case '/':
                    kq.value = num2 !== 0 ? num1 / num2 : "Không chia được cho 0";
                    break;
            }
        }
    </script>
</body>
</html>
